<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  
    <defs>
      <!-- Gradients -->
      <linearGradient id="init-food-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#18120B" />
        <stop offset="45%" stop-color="#241B12" />
        <stop offset="100%" stop-color="#0E0A07" />
      </linearGradient>
      <linearGradient id="init-food-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E8C782" />
        <stop offset="35%" stop-color="#C89A4A" />
        <stop offset="70%" stop-color="#E3BD76" />
        <stop offset="100%" stop-color="#9E7332" />
      </linearGradient>
      <linearGradient id="init-food-gold-soft" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#C89A4A" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#C89A4A" stop-opacity="0.2" />
      </linearGradient>
      <radialGradient id="init-food-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.28" />
        <stop offset="50%" stop-color="#C89A4A" stop-opacity="0.10" />
        <stop offset="100%" stop-color="#140F0A" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="init-food-vignette" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#070503" stop-opacity="0.75" />
      </radialGradient>
      <filter id="init-food-blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="30" />
      </filter>
    </defs>
    
  <rect width="600" height="400" fill="url(#init-food-bg)" />
  <circle cx="300" cy="190" r="240" fill="url(#init-food-glow)" />

  <!-- Background Mandala Rays -->
  <g stroke="url(#init-food-gold)" stroke-width="0.5" opacity="0.12" fill="none">
    <pattern id="init-food-pat" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M18 0 L36 18 L18 36 L0 18 Z" />
      <circle cx="18" cy="18" r="3" />
    </pattern>
    <rect x="20" y="20" width="560" height="360" fill="url(#init-food-pat)" />
  </g>

  <!-- Border -->
  <rect x="20" y="20" width="560" height="360" rx="8" fill="none" stroke="url(#init-food-gold)" stroke-width="1.2" opacity="0.45" />
  <rect x="28" y="28" width="544" height="344" rx="4" fill="none" stroke="url(#init-food-gold)" stroke-width="0.6" stroke-dasharray="6 3" opacity="0.3" />

  <!-- Central Akshaya Patra / Sacred Vessel of Abundance & Grain -->
  <g transform="translate(300, 180)">
    <!-- Decorative Radial Halo -->
    <circle cx="0" cy="-10" r="105" fill="none" stroke="url(#init-food-gold)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.35" />
    <circle cx="0" cy="-10" r="85" fill="none" stroke="url(#init-food-gold)" stroke-width="1" opacity="0.45" />

    <!-- Radiant Sheaves of Grain (Dhanya) flanking vessel -->
    <g stroke="url(#init-food-gold)" stroke-width="1.1" fill="none" opacity="0.65">
      <!-- Left Stalk -->
      <path d="M0 30 C-20 15, -45 -10, -60 -45" />
      <circle cx="-42" cy="-8" r="3" fill="#D4AF37" />
      <circle cx="-52" cy="-24" r="3" fill="#D4AF37" />
      <circle cx="-60" cy="-45" r="3.5" fill="#D4AF37" />
      <!-- Right Stalk -->
      <path d="M0 30 C20 15, 45 -10, 60 -45" />
      <circle cx="42" cy="-8" r="3" fill="#D4AF37" />
      <circle cx="52" cy="-24" r="3" fill="#D4AF37" />
      <circle cx="60" cy="-45" r="3.5" fill="#D4AF37" />
    </g>

    <!-- Sacred Kalash / Akshaya Patra Bowl -->
    <g transform="translate(0, 5)" stroke="url(#init-food-gold)" fill="none" stroke-width="1.4">
      <!-- Pedestal Stand -->
      <path d="M-30 45 L30 45 L20 38 L-20 38 Z" fill="#1C140D" />
      <line x1="-38" y1="46" x2="38" y2="46" stroke-width="1.8" />
      <!-- Bowl Body -->
      <path d="M-45 10 C-45 35, 45 35, 45 10 C45 0, -45 0, -45 10 Z" fill="#1C140D" fill-opacity="0.9" />
      <path d="M-48 10 C-48 3, 48 3, 48 10 C48 17, -48 17, -48 10 Z" fill="rgba(200, 154, 74, 0.25)" />
      <!-- Grain Abundance Dome -->
      <path d="M-40 4 C-35 -22, 35 -22, 40 4 Z" fill="rgba(200, 154, 74, 0.3)" />
      <circle cx="0" cy="-12" r="4" fill="#E8C782" />
      <circle cx="-16" cy="-6" r="3.5" fill="#D4AF37" />
      <circle cx="16" cy="-6" r="3.5" fill="#D4AF37" />
    </g>

    <!-- Inscription -->
    <text y="78" text-anchor="middle" fill="#E8C782" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11.5" letter-spacing="3.5" opacity="0.9">ANNA • DANAM • MAHA • DANAM</text>
    <text y="95" text-anchor="middle" fill="#C89A4A" font-family="'Cinzel', Georgia, serif" font-size="8.5" letter-spacing="2" opacity="0.65">NURTURING COMMUNITY WITH DIGNITY</text>
  </g>

  <!-- Vignette -->
  <rect width="600" height="400" fill="url(#init-food-vignette)" pointer-events="none" />
</svg>