<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  
    <defs>
      <!-- Gradients -->
      <linearGradient id="classical-cov-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#18120B" />
        <stop offset="45%" stop-color="#241B12" />
        <stop offset="100%" stop-color="#0E0A07" />
      </linearGradient>
      <linearGradient id="classical-cov-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E8C782" />
        <stop offset="35%" stop-color="#C89A4A" />
        <stop offset="70%" stop-color="#E3BD76" />
        <stop offset="100%" stop-color="#9E7332" />
      </linearGradient>
      <linearGradient id="classical-cov-gold-soft" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#C89A4A" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#C89A4A" stop-opacity="0.2" />
      </linearGradient>
      <radialGradient id="classical-cov-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.28" />
        <stop offset="50%" stop-color="#C89A4A" stop-opacity="0.10" />
        <stop offset="100%" stop-color="#140F0A" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="classical-cov-vignette" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#070503" stop-opacity="0.75" />
      </radialGradient>
      <filter id="classical-cov-blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="30" />
      </filter>
    </defs>
    
  <rect width="1200" height="800" fill="url(#classical-cov-bg)" />
  <circle cx="600" cy="380" r="380" fill="url(#classical-cov-glow)" />

  <!-- Acoustic Wave Line Background -->
  <g stroke="url(#classical-cov-gold)" stroke-width="0.5" opacity="0.10" fill="none">
    <circle cx="600" cy="380" r="60" stroke-dasharray="2 3" /><circle cx="600" cy="380" r="90" stroke-dasharray="3 4" /><circle cx="600" cy="380" r="120" stroke-dasharray="4 5" /><circle cx="600" cy="380" r="150" stroke-dasharray="5 6" /><circle cx="600" cy="380" r="180" stroke-dasharray="6 7" /><circle cx="600" cy="380" r="210" stroke-dasharray="7 8" /><circle cx="600" cy="380" r="240" stroke-dasharray="8 9" /><circle cx="600" cy="380" r="270" stroke-dasharray="9 10" /><circle cx="600" cy="380" r="300" stroke-dasharray="10 11" /><circle cx="600" cy="380" r="330" stroke-dasharray="11 12" /><circle cx="600" cy="380" r="360" stroke-dasharray="12 13" /><circle cx="600" cy="380" r="390" stroke-dasharray="13 14" /><circle cx="600" cy="380" r="420" stroke-dasharray="14 15" /><circle cx="600" cy="380" r="450" stroke-dasharray="15 16" />
  </g>

  <!-- Heritage Borders -->
  <rect x="36" y="36" width="1128" height="728" rx="10" fill="none" stroke="url(#classical-cov-gold)" stroke-width="1.4" opacity="0.5" />
  <rect x="48" y="48" width="1104" height="704" rx="6" fill="none" stroke="url(#classical-cov-gold)" stroke-width="0.8" stroke-dasharray="8 4" opacity="0.3" />

  <!-- Central Sitar & Swara Mandala Emblem -->
  <g transform="translate(600, 360)">
    <!-- Stage Spotlight Aureole -->
    <circle cx="0" cy="0" r="210" fill="none" stroke="url(#classical-cov-gold)" stroke-width="1" opacity="0.4" />
    <circle cx="0" cy="0" r="170" fill="none" stroke="url(#classical-cov-gold)" stroke-width="1.4" opacity="0.5" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#classical-cov-gold)" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.35" />

    <!-- Sitar / Tanpura Stylized Vector Silhouette -->
    <g transform="translate(0, 10)">
      <!-- Gourd Resonator (Tumba) -->
      <path d="M-65 90 C-65 35, -25 15, 0 10 C25 15, 65 35, 65 90 C65 140, -65 140, -65 90 Z" fill="#1C140D" stroke="url(#classical-cov-gold)" stroke-width="2" />
      <ellipse cx="0" cy="95" rx="38" ry="24" fill="rgba(200, 154, 74, 0.2)" stroke="url(#classical-cov-gold)" stroke-width="1" />
      <!-- Long Neck (Dandi) with Frets -->
      <rect x="-10" y="-170" width="20" height="190" fill="#1C140D" stroke="url(#classical-cov-gold)" stroke-width="1.8" />
      <!-- Frets (Pardas) -->
      <line x1="-12" y1="-150" x2="12" y2="-150" stroke="#D4AF37" stroke-width="1.4" /><line x1="-12" y1="-134" x2="12" y2="-134" stroke="#D4AF37" stroke-width="1.4" /><line x1="-12" y1="-118" x2="12" y2="-118" stroke="#D4AF37" stroke-width="1.4" /><line x1="-12" y1="-102" x2="12" y2="-102" stroke="#D4AF37" stroke-width="1.4" /><line x1="-12" y1="-86" x2="12" y2="-86" stroke="#D4AF37" stroke-width="1.4" /><line x1="-12" y1="-70" x2="12" y2="-70" stroke="#D4AF37" stroke-width="1.4" /><line x1="-12" y1="-54" x2="12" y2="-54" stroke="#D4AF37" stroke-width="1.4" /><line x1="-12" y1="-38" x2="12" y2="-38" stroke="#D4AF37" stroke-width="1.4" /><line x1="-12" y1="-22" x2="12" y2="-22" stroke="#D4AF37" stroke-width="1.4" /><line x1="-12" y1="-6" x2="12" y2="-6" stroke="#D4AF37" stroke-width="1.4" />
      <!-- Strings -->
      <line x1="-4" y1="-170" x2="-4" y2="90" stroke="#FFF5D6" stroke-width="0.8" opacity="0.8" />
      <line x1="0" y1="-170" x2="0" y2="90" stroke="#FFF5D6" stroke-width="0.9" opacity="0.9" />
      <line x1="4" y1="-170" x2="4" y2="90" stroke="#FFF5D6" stroke-width="0.8" opacity="0.8" />
      <!-- Peg Box & Upper Tuning Pegs (Kuntis) -->
      <path d="M-14 -170 L14 -170 L8 -195 L-8 -195 Z" fill="#C89A4A" stroke="url(#classical-cov-gold)" stroke-width="1.2" />
      <circle cx="-16" cy="-160" r="3" fill="#E8C782" />
      <circle cx="16" cy="-160" r="3" fill="#E8C782" />
      <circle cx="-16" cy="-140" r="3" fill="#E8C782" />
      <circle cx="16" cy="-140" r="3" fill="#E8C782" />
    </g>

    <!-- Surrounding Classical Swara Syllables -->
    <g fill="#E8C782" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" letter-spacing="3" opacity="0.75" text-anchor="middle">
      <text x="0" y="-185">SA</text>
      <text x="135" y="-130">RE</text>
      <text x="190" y="0">GA</text>
      <text x="135" y="130">MA</text>
      <text x="0" y="195">PA</text>
      <text x="-135" y="130">DHA</text>
      <text x="-190" y="0">NI</text>
      <text x="-135" y="-130">SȦ</text>
    </g>

    <!-- Typography Inscription -->
    <text y="240" text-anchor="middle" fill="#FBF8F3" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" letter-spacing="8" font-weight="600">CLASSICAL MUSIC EVENING</text>
    <text y="272" text-anchor="middle" fill="#C89A4A" font-family="'Cinzel', Georgia, serif" font-size="12" letter-spacing="5" opacity="0.8">RAGA • TAAL • SHASTRIYA SANGEET</text>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="800" fill="url(#classical-cov-vignette)" pointer-events="none" />
</svg>