<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  
    <defs>
      <!-- Gradients -->
      <linearGradient id="home-charity-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#18120B" />
        <stop offset="45%" stop-color="#241B12" />
        <stop offset="100%" stop-color="#0E0A07" />
      </linearGradient>
      <linearGradient id="home-charity-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E8C782" />
        <stop offset="35%" stop-color="#C89A4A" />
        <stop offset="70%" stop-color="#E3BD76" />
        <stop offset="100%" stop-color="#9E7332" />
      </linearGradient>
      <linearGradient id="home-charity-gold-soft" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#C89A4A" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#C89A4A" stop-opacity="0.2" />
      </linearGradient>
      <radialGradient id="home-charity-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.28" />
        <stop offset="50%" stop-color="#C89A4A" stop-opacity="0.10" />
        <stop offset="100%" stop-color="#140F0A" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="home-charity-vignette" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#070503" stop-opacity="0.75" />
      </radialGradient>
      <filter id="home-charity-blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="30" />
      </filter>
    </defs>
    
  <rect width="420" height="280" fill="url(#home-charity-bg)" />
  <circle cx="210" cy="135" r="160" fill="url(#home-charity-glow)" />

  <!-- Subtle Jaali Background Pattern -->
  <g stroke="url(#home-charity-gold)" stroke-width="0.5" opacity="0.10" fill="none">
    <pattern id="home-charity-pat" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M14 0 L28 14 L14 28 L0 14 Z" />
      <circle cx="14" cy="14" r="3" />
    </pattern>
    <rect width="420" height="280" fill="url(#home-charity-pat)" />
  </g>

  <!-- Inner Architectural Arch Frame -->
  <rect x="15" y="15" width="390" height="250" rx="6" fill="none" stroke="url(#home-charity-gold)" stroke-width="1" opacity="0.4" />
  <rect x="21" y="21" width="378" height="238" rx="4" fill="none" stroke="url(#home-charity-gold)" stroke-width="0.5" stroke-dasharray="4 2" opacity="0.25" />

  <!-- Central Nishkama Seva Emblem: Cupped Hands with Glowing Diya -->
  <g transform="translate(210, 130)">
    <!-- Halo -->
    <circle cx="0" cy="-5" r="75" fill="none" stroke="url(#home-charity-gold)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.35" />
    <circle cx="0" cy="-5" r="60" fill="none" stroke="url(#home-charity-gold)" stroke-width="1.1" opacity="0.45" />

    <!-- Protective Service Hands -->
    <g stroke="url(#home-charity-gold)" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-55 35 C-42 46, -24 52, 0 52 C-16 42, -30 28, -36 12 C-44 22, -50 28, -55 35 Z" fill="#1C140D" fill-opacity="0.8" />
      <path d="M55 35 C42 46, 24 52, 0 52 C16 42, 30 28, 36 12 C44 22, 50 28, 55 35 Z" fill="#1C140D" fill-opacity="0.8" />
    </g>

    <!-- Traditional Brass Diya Lamp Resting in Center -->
    <g transform="translate(0, 10)" stroke="url(#home-charity-gold)" fill="none" stroke-width="1.3">
      <!-- Diya Body -->
      <path d="M-28 6 C-24 22, 24 22, 28 6 C20 4, -20 4, -28 6 Z" fill="#1C140D" fill-opacity="0.9" />
      <ellipse cx="0" cy="5" rx="26" ry="4" fill="rgba(200, 154, 74, 0.25)" />
      <!-- Radiant Flame -->
      <path d="M0 -22 C6 -14, 8 -8, 0 2 C-8 -8, -6 -14, 0 -22 Z" fill="#F2D082" />
      <circle cx="0" cy="-4" r="3" fill="#C89A4A" />
    </g>

    <!-- Lotus Leaves Base -->
    <g transform="translate(0, 36)" stroke="url(#home-charity-gold)" stroke-width="0.9" fill="none" opacity="0.6">
      <path d="M0 0 C-10 -6, -20 -6, -26 0" />
      <path d="M0 0 C10 -6, 20 -6, 26 0" />
    </g>

    <!-- Inscription -->
    <text y="78" text-anchor="middle" fill="#E8C782" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="10.5" letter-spacing="3" opacity="0.9">NISHKAMA • SEVA</text>
    <text y="92" text-anchor="middle" fill="#C89A4A" font-family="'Cinzel', Georgia, serif" font-size="7.5" letter-spacing="1.8" opacity="0.65">COMMUNITY WELFARE &amp; CARE</text>
  </g>

  <!-- Vignette -->
  <rect width="420" height="280" fill="url(#home-charity-vignette)" pointer-events="none" />
</svg>