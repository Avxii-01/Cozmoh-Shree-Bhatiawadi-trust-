<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  
    <defs>
      <!-- Gradients -->
      <linearGradient id="navratri-cov-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#18120B" />
        <stop offset="45%" stop-color="#241B12" />
        <stop offset="100%" stop-color="#0E0A07" />
      </linearGradient>
      <linearGradient id="navratri-cov-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E8C782" />
        <stop offset="35%" stop-color="#C89A4A" />
        <stop offset="70%" stop-color="#E3BD76" />
        <stop offset="100%" stop-color="#9E7332" />
      </linearGradient>
      <linearGradient id="navratri-cov-gold-soft" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#C89A4A" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#C89A4A" stop-opacity="0.2" />
      </linearGradient>
      <radialGradient id="navratri-cov-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.28" />
        <stop offset="50%" stop-color="#C89A4A" stop-opacity="0.10" />
        <stop offset="100%" stop-color="#140F0A" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="navratri-cov-vignette" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#070503" stop-opacity="0.75" />
      </radialGradient>
      <filter id="navratri-cov-blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="30" />
      </filter>
    </defs>
    
  <rect width="1200" height="800" fill="url(#navratri-cov-bg)" />
  <circle cx="600" cy="380" r="380" fill="url(#navratri-cov-glow)" />

  <!-- Traditional Bandhani / Patola Geometric Background -->
  <g stroke="url(#navratri-cov-gold)" stroke-width="0.6" opacity="0.09" fill="none">
    <pattern id="navratri-cov-pat" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="60" height="60" />
      <circle cx="30" cy="30" r="16" />
      <polygon points="30,6 54,30 30,54 6,30" />
      <circle cx="30" cy="30" r="4" fill="#C89A4A" opacity="0.4" />
    </pattern>
    <rect width="1200" height="800" fill="url(#navratri-cov-pat)" />
  </g>

  <!-- Dual Outer Heritage Borders -->
  <rect x="36" y="36" width="1128" height="728" rx="10" fill="none" stroke="url(#navratri-cov-gold)" stroke-width="1.4" opacity="0.5" />
  <rect x="48" y="48" width="1104" height="704" rx="6" fill="none" stroke="url(#navratri-cov-gold)" stroke-width="0.8" stroke-dasharray="8 4" opacity="0.3" />

  <!-- Corner Toran Flourishes -->
  <g stroke="url(#navratri-cov-gold)" stroke-width="1.4" fill="none" opacity="0.7">
    <circle cx="70" cy="70" r="4" fill="#D4AF37" />
    <circle cx="1130" cy="70" r="4" fill="#D4AF37" />
    <circle cx="70" cy="730" r="4" fill="#D4AF37" />
    <circle cx="1130" cy="730" r="4" fill="#D4AF37" />
  </g>

  <!-- Central Raas Mandala & Crossed Dandiya Sticks -->
  <g transform="translate(600, 360)">
    <!-- Outer 16-Petal Mandala Ring -->
    <circle cx="0" cy="0" r="220" fill="none" stroke="url(#navratri-cov-gold)" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.3" />
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#navratri-cov-gold)" stroke-width="1.3" opacity="0.45" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#navratri-cov-gold)" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.3" />
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#navratri-cov-gold)" stroke-width="1.5" opacity="0.5" />

    <!-- 16 Rotating Mandala Petals -->
    <g stroke="url(#navratri-cov-gold)" stroke-width="1" fill="rgba(200, 154, 74, 0.08)">
      <path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(0.0)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(22.5)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(45.0)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(67.5)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(90.0)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(112.5)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(135.0)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(157.5)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(180.0)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(202.5)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(225.0)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(247.5)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(270.0)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(292.5)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(315.0)" /><path d="M0 -180 Q16 -150 0 -140 Q-16 -150 0 -180 Z" transform="rotate(337.5)" />
    </g>

    <!-- Radiating Festive Diya Dots -->
    <g fill="#D4AF37">
      <circle cx="0" cy="-180" r="3.5" transform="rotate(0)" /><circle cx="0" cy="-180" r="3.5" transform="rotate(45)" /><circle cx="0" cy="-180" r="3.5" transform="rotate(90)" /><circle cx="0" cy="-180" r="3.5" transform="rotate(135)" /><circle cx="0" cy="-180" r="3.5" transform="rotate(180)" /><circle cx="0" cy="-180" r="3.5" transform="rotate(225)" /><circle cx="0" cy="-180" r="3.5" transform="rotate(270)" /><circle cx="0" cy="-180" r="3.5" transform="rotate(315)" />
    </g>

    <!-- Crossed Ceremonial Dandiya Sticks -->
    <g stroke="url(#navratri-cov-gold)" stroke-width="4" stroke-linecap="round" fill="none">
      <!-- Stick 1 (Diagonal Left to Right) -->
      <line x1="-130" y1="110" x2="130" y2="-110" stroke="#E8C782" stroke-width="6" />
      <line x1="-130" y1="110" x2="130" y2="-110" stroke="#9E7332" stroke-width="2" />
      <!-- Stick 2 (Diagonal Right to Left) -->
      <line x1="130" y1="110" x2="-130" y2="-110" stroke="#E8C782" stroke-width="6" />
      <line x1="130" y1="110" x2="-130" y2="-110" stroke="#9E7332" stroke-width="2" />
      <!-- Decorative Grip Bands & Rings -->
      <g stroke="#C89A4A" stroke-width="2">
        <line x1="-115" y1="97" x2="-105" y2="107" />
        <line x1="-95" y1="80" x2="-85" y2="90" />
        <line x1="105" y1="-97" x2="115" y2="-107" />
        <line x1="85" y1="-80" x2="95" y2="-90" />
        <line x1="115" y1="97" x2="105" y2="107" />
        <line x1="95" y1="80" x2="85" y2="90" />
        <line x1="-105" y1="-97" x2="-115" y2="-107" />
        <line x1="-85" y1="-80" x2="-95" y2="-90" />
      </g>
    </g>

    <!-- Center Jewel Motif -->
    <circle cx="0" cy="0" r="22" fill="#1C140D" stroke="url(#navratri-cov-gold)" stroke-width="2" />
    <circle cx="0" cy="0" r="12" fill="#C89A4A" />
    <circle cx="0" cy="0" r="5" fill="#FFF5D6" />

    <!-- Typography Inscription -->
    <text y="240" text-anchor="middle" fill="#FBF8F3" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="22" letter-spacing="8" font-weight="600">NAVRATRI GARBA MAHOTSAV</text>
    <text y="272" text-anchor="middle" fill="#C89A4A" font-family="'Cinzel', Georgia, serif" font-size="12" letter-spacing="5" opacity="0.8">DEVOTION • RAAS • TRADITION</text>
  </g>

  <!-- Vignette -->
  <rect width="1200" height="800" fill="url(#navratri-cov-vignette)" pointer-events="none" />
</svg>