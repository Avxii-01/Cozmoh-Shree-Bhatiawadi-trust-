<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  
    <defs>
      <!-- Gradients -->
      <linearGradient id="gal-gallery-navratri-02-svg-bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#18120B" />
        <stop offset="45%" stop-color="#241B12" />
        <stop offset="100%" stop-color="#0E0A07" />
      </linearGradient>
      <linearGradient id="gal-gallery-navratri-02-svg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E8C782" />
        <stop offset="35%" stop-color="#C89A4A" />
        <stop offset="70%" stop-color="#E3BD76" />
        <stop offset="100%" stop-color="#9E7332" />
      </linearGradient>
      <linearGradient id="gal-gallery-navratri-02-svg-gold-soft" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#C89A4A" stop-opacity="0.8" />
        <stop offset="100%" stop-color="#C89A4A" stop-opacity="0.2" />
      </linearGradient>
      <radialGradient id="gal-gallery-navratri-02-svg-glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.28" />
        <stop offset="50%" stop-color="#C89A4A" stop-opacity="0.10" />
        <stop offset="100%" stop-color="#140F0A" stop-opacity="0" />
      </radialGradient>
      <radialGradient id="gal-gallery-navratri-02-svg-vignette" cx="50%" cy="50%" r="70%">
        <stop offset="40%" stop-color="#000000" stop-opacity="0" />
        <stop offset="100%" stop-color="#070503" stop-opacity="0.75" />
      </radialGradient>
      <filter id="gal-gallery-navratri-02-svg-blur" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="30" />
      </filter>
    </defs>
    
  <rect width="800" height="600" fill="url(#gal-gallery-navratri-02-svg-bg)" />
  <circle cx="400" cy="270" r="260" fill="url(#gal-gallery-navratri-02-svg-glow)" />

  <!-- Background Lattice -->
  <g stroke="url(#gal-gallery-navratri-02-svg-gold)" stroke-width="0.5" opacity="0.08" fill="none">
    <pattern id="gal-gallery-navratri-02-svg-pat" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 20 L20 40 L0 20 Z" />
      <circle cx="20" cy="20" r="4" />
    </pattern>
    <rect width="800" height="600" fill="url(#gal-gallery-navratri-02-svg-pat)" />
  </g>

  <!-- Borders -->
  <rect x="25" y="25" width="750" height="550" rx="8" fill="none" stroke="url(#gal-gallery-navratri-02-svg-gold)" stroke-width="1.2" opacity="0.45" />
  <rect x="33" y="33" width="734" height="534" rx="4" fill="none" stroke="url(#gal-gallery-navratri-02-svg-gold)" stroke-width="0.6" stroke-dasharray="6 3" opacity="0.25" />

  <!-- Motif -->
  <g transform="translate(400, 250)">
    
        <g stroke="url(#gal-gallery-navratri-02-svg-gold)" stroke-width="1.3" fill="none">
          <circle cx="0" cy="0" r="95" opacity="0.3" />
          <circle cx="0" cy="0" r="75" stroke-dasharray="4 2" opacity="0.45" />
          <!-- Trishul / Devotional Flame Motif -->
          <path d="M0 -75 L0 50" stroke-width="2" />
          <path d="M-30 -40 C-30 -10, -5 10, 0 20 C5 10, 30 -10, 30 -40" stroke-width="1.6" />
          <path d="M0 -75 C6 -60, 6 -50, 0 -40 C-6 -50, -6 -60, 0 -75 Z" fill="#F2D082" />
        </g>
        
    <text y="145" text-anchor="middle" fill="#FBF8F3" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" letter-spacing="5" font-weight="600">SHAKTI UTSAV</text>
    <text y="170" text-anchor="middle" fill="#C89A4A" font-family="'Cinzel', Georgia, serif" font-size="10" letter-spacing="3" opacity="0.8">Nine Nights of Devotion</text>
  </g>

  <!-- Vignette -->
  <rect width="800" height="600" fill="url(#gal-gallery-navratri-02-svg-vignette)" pointer-events="none" />
</svg>